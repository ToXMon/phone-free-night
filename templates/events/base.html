<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Phone-Free Night{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 720px; padding: 0 1rem; line-height: 1.5; }
    a { color: #0b5fff; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
    button, input[type="submit"] { padding: 0.6rem 1rem; font-size: 1rem; }
    input, select { padding: 0.5rem; font-size: 1rem; width: 100%; box-sizing: border-box; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 1rem; margin: 1rem 0; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <header>
    <p><a href="{% url 'home' %}">Phone-Free Night</a> · <a href="{% url 'guest-join' %}">Join an event</a> · <a href="{% url 'event-list' %}">Host dashboard</a></p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
