<table>
  <thead>
    <tr><th>Guest</th><th>Team</th><th>Phone-free minutes</th><th>Unlocks</th><th>Raffle entries</th></tr>
  </thead>
  <tbody>
    {% for guest in guests %}
    <tr>
      <td>{{ guest.display_name }}</td>
      <td>{{ guest.team_name }}</td>
      <td>{{ guest.phone_free_minutes }}</td>
      <td>{{ guest.unlock_count }}</td>
      <td>{{ guest.raffle_entries }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="5">No guests yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
