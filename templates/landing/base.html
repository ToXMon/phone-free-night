<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Phone-Free Night: Phones down. Game on.{% endblock %}</title>
  <meta name="description" content="Phone-Free Night helps bar trivia hosts stop phone cheating, keep guests in the room, and put local sponsors on the leaderboard.">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
  /* Hallmark · shape: Manifesto, Ledge hero · genre: editorial · theme: Manifesto (deal 1/3, seed phone-free-night-bar-trivia-5ba6·9745cba9·2026-10-28·r0) · job: sign up · v2.0.0 */
  /* Hallmark · waive 38iii · theme names the coloured word as its signature and it appears once on the page, in the hero · Manifesto theme requires one red word */
  /* Hallmark · waive 55b · hero lines each sit in their own element and never wrap, sized in clamp · Manifesto Ledge hero requires nowrap lines */
  :root {
    --color-paper: oklch(13% 0.01 60); --color-paper-2: oklch(17% 0.011 60); --color-paper-3: oklch(22% 0.012 60);
    --color-ink: oklch(95% 0.014 85); --color-ink-2: oklch(84% 0.012 80); --color-muted: oklch(64% 0.016 65);
    --color-rule: oklch(31% 0.014 60);
    --color-accent: oklch(56% 0.228 28); --color-accent-deep: oklch(49% 0.2 28); --color-accent-text: oklch(64% 0.22 28); --color-accent-ink: oklch(98.5% 0.004 90);
    --color-focus: oklch(64% 0.22 28);
    --font-display: "Anton", "Impact", sans-serif; --font-body: "Public Sans", ui-sans-serif, system-ui, sans-serif;
    --space-md: 16px; --space-lg: 24px; --space-2xl: 64px; --gap-columns: 32px;
    --text-sm: 0.875rem; --text-title: clamp(1.25rem, 0.75vw + 0.875rem, 1.625rem); --text-section: clamp(2rem, 2.5vw + 1rem, 3.5rem); --text-display: clamp(4.5rem, 12vw, 13rem);
    --dur-short: 220ms; --dur-long: 420ms; --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --rule-hair: 1px; --rule-bar: 4px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; background: var(--color-paper); color: var(--color-ink-2); font-family: var(--font-body); font-size: 1rem; line-height: 1.55; }
  :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  a { color: inherit; text-underline-offset: 0.16em; }
  h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 400; letter-spacing: 0.004em; line-height: 1.02; overflow-wrap: break-word; min-width: 0; color: var(--color-ink); }
  h2 { font-size: var(--text-section); padding-top: var(--space-2xl); }
  h3 { font-size: var(--text-title); }
  .container { width: 100%; max-width: 1440px; margin-inline: auto; padding-inline: 64px; }
  .nav { border-bottom: var(--rule-bar) solid var(--color-ink); }
  .nav-inner { display: flex; justify-content: space-between; align-items: center; padding-top: var(--space-md); padding-bottom: var(--space-md); }
  .wordmark { font-family: var(--font-display); font-size: var(--text-title); color: var(--color-ink); text-decoration: none; }
  .label { font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); }
  .display { line-height: 0.9; }
  .display > span { display: block; white-space: nowrap; }
  .display .hot { color: var(--color-accent-text); }
  h1.display { font-size: var(--text-display); }
  section { padding-bottom: var(--space-2xl); border-bottom: var(--rule-hair) solid var(--color-rule); }
  .lead { font-size: 1.3125rem; line-height: 1.45; max-width: 52ch; margin-top: var(--space-lg); }
  .actions { display: flex; gap: var(--space-md); flex-wrap: wrap; margin-top: var(--space-lg); }
  .btn { display: inline-block; padding: 12px 24px; font-weight: 600; text-decoration: none; border: var(--rule-hair) solid transparent; transition: background-color var(--dur-short) var(--ease-out); }
  .btn-primary { background: var(--color-accent); color: var(--color-accent-ink); }
  .btn-primary:hover { background: var(--color-accent-deep); }
  .btn-secondary { border-color: var(--color-ink-2); color: var(--color-ink); }
  .btn-secondary:hover { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
  .btn:active { transform: translate(1px, 1px); }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: var(--gap-columns); padding-top: var(--space-lg); padding-bottom: var(--space-lg); border-top: var(--rule-hair) solid var(--color-rule); align-items: baseline; }
  .row .num { font-family: var(--font-display); font-size: var(--text-section); color: var(--color-muted); font-variant-numeric: tabular-nums; }
  .row p { max-width: 65ch; }
  .band-red { background: var(--color-accent); color: var(--color-accent-ink); padding-top: var(--space-2xl); padding-bottom: var(--space-2xl); }
  .band-red h2 { color: var(--color-accent-ink); padding-top: 0; }
  .band-red .btn-primary { background: var(--color-paper); color: var(--color-ink); }
  .band-red p { color: var(--color-accent-ink); }
  input { width: 100%; padding: 12px; font-size: 1.05rem; border: var(--rule-hair) solid var(--color-ink-2); background: var(--color-paper-2); color: var(--color-ink); }
  label { display: block; font-weight: 600; margin: 16px 0 6px; color: var(--color-accent-ink); }
  footer { padding-top: var(--space-2xl); padding-bottom: var(--space-2xl); }
  .reveal { animation: wipe var(--dur-long) var(--ease-out) both; }
  @keyframes wipe { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0); } }
  @media (max-width: 40rem) { .row { grid-template-columns: 1fr; } .container { padding-inline: 16px; } h1.display { font-size: clamp(3.5rem, 18vw, 6rem); } }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
  @media print { header, footer, .no-print { display: none !important; } }
  </style>
</head>
<body>
  <header class="nav"><div class="container nav-inner">
    <a class="wordmark" href="{% url 'starter-kit' %}">PHONE-FREE NIGHT</a>
    <a class="btn btn-secondary" href="{% url 'starter-kit' %}">Get the kit</a>
  </div></header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer><div class="container">
    <p class="wordmark">PHONE-FREE NIGHT</p>
    <p class="label">For bar trivia hosts first. Trivia first, comedy and other live nights later, through the same towns.</p>
    <p><a href="{% url 'starter-kit' %}">Starter Kit</a></p>
  </div></footer>
</body>
</html>
