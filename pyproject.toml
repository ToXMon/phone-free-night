[project]
name = "phone-free-night"
version = "0.1.0"
description = "Phone-Free Night: trivia-host SaaS with phone-free-minute scoring and sponsor raffles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<6.0",
    "djangorestframework>=3.15",
]

[project.optional-dependencies]
dev = [
    "djlint~=1.46.4",
    "pytest~=9.0",
    "pytest-django~=4.14.0",
    "ruff~=0.14.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "events*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-q"
testpaths = ["events"]
python_files = ["test_*.py", "tests.py"]
